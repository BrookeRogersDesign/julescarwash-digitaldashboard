<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jules Carwash | Member Gift Card</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="Jules_Logo-20191.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --accent:#2F6EBB;--dark-blue:#1A2A40;--red:#ED1C24;
    --ink:#1A2A40;--ink-mid:#4A5A70;--line:#C9D3E0;
    --font:'Avenir','Avenir Next','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  body{background:#EEF2F7;color:var(--ink);font-family:var(--font);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 16px;}

  /* 7in x 4in card with a dashed cut line */
  .card{width:7in;max-width:100%;aspect-ratio:7/4;background:#fff;border:2px dashed var(--line);border-radius:18px;
    padding:0.35in 0.4in;display:grid;grid-template-columns:1fr 2.3in;gap:0.3in;position:relative;overflow:hidden;}
  .card::after{content:'';position:absolute;right:-1.2in;bottom:-1.6in;width:3.6in;height:3.6in;border-radius:50%;
    border:28px solid rgba(47,110,187,0.08);pointer-events:none;}
  .left{display:flex;flex-direction:column;}
  .logo{height:0.62in;width:auto;align-self:flex-start;}
  .thanks{font-size:22px;font-weight:800;line-height:1.15;margin-top:0.2in;color:var(--dark-blue);}
  .thanks span{color:var(--accent);}
  .for{font-size:13px;color:var(--ink-mid);margin-top:8px;}
  .tofrom{margin-top:auto;display:grid;gap:10px;}
  .line{display:flex;align-items:flex-end;gap:8px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-mid);}
  .line input{flex:1;border:none;border-bottom:1.5px solid var(--line);font:inherit;font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);padding:2px 4px;background:transparent;outline:none;}

  .right{background:var(--dark-blue);color:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0.2in;position:relative;z-index:1;}
  .gift-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.7);}
  .amount{font-size:64px;font-weight:800;line-height:1;margin:6px 0 2px;}
  .amount sup{font-size:28px;vertical-align:top;position:relative;top:8px;}
  .kind{font-size:12px;font-weight:600;color:rgba(255,255,255,0.85);}
  .code-box{margin-top:16px;width:100%;background:#fff;border-radius:8px;padding:8px 6px;}
  .code-box .gift-label{color:var(--ink-mid);font-size:9px;}
  .code-box input{width:100%;border:none;text-align:center;font:inherit;font-size:18px;font-weight:800;letter-spacing:2px;color:var(--red);background:transparent;outline:none;margin-top:2px;}
  .fine{position:absolute;left:0.4in;bottom:0.12in;font-size:9px;color:var(--ink-mid);}

  .controls{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--ink-mid);text-align:center;flex-wrap:wrap;justify-content:center;}
  .controls button{font:inherit;font-weight:700;font-size:14px;background:var(--accent);color:#fff;border:none;border-radius:50px;padding:12px 28px;cursor:pointer;}

  @media(max-width:600px){
    .card{aspect-ratio:auto;grid-template-columns:1fr;padding:20px 20px 32px;}
    .tofrom{margin-top:18px;}
    .fine{left:20px;bottom:10px;}
  }
  @media print{
    @page{size:letter;margin:0.5in;}
    body{background:#fff;min-height:0;padding:0;display:block;}
    .controls{display:none;}
    .card{margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .line input,.code-box input{border-color:var(--line);}
  }
</style>
</head>
<body>

<div class="card">
  <div class="left">
    <img class="logo" src="Jules_Logo-20191.png" alt="Jules Carwash">
    <div class="thanks">We are thankful<br>for <span>our members</span></div>
    <div class="for">A gift for anyone, including yourself.</div>
    <div class="tofrom">
      <label class="line">To<input aria-label="To"></label>
      <label class="line">From<input aria-label="From"></label>
    </div>
  </div>
  <div class="right">
    <div class="gift-label">For you to gift</div>
    <div class="amount"><sup>$</sup>10</div>
    <div class="kind">Jules Carwash gift card</div>
    <div class="code-box">
      <div class="gift-label">One-time code</div>
      <input id="code" aria-label="One-time code" placeholder="________" maxlength="24">
    </div>
  </div>
  <div class="fine">One-time use. *Terms and conditions apply.</div>
</div>

<div class="controls">
  <span>Type your code and names on the card, then print.</span>
  <button onclick="window.print()">Print</button>
</div>

<script>
  // A link like member-gift-card.html?code=ABC123 fills the code in
  const code = new URLSearchParams(location.search).get('code');
  if (code) document.getElementById('code').value = code.slice(0, 24);
</script>
</body>
</html>
